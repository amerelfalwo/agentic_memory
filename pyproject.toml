[project]
name = "agentic-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI Assistant", email = "bot@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pypdf>=6.18.1",
    "weaviate-client>=4.23.1",
]

[project.scripts]
agentic-memory = "agentic_memory:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
