[project]
name = "agentic-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI Assistant", email = "bot@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.110.0",
    "fonttools>=4.65.0",
    "httpx>=0.27.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic>=2.6.0",
    "pypdf>=6.18.1",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.28.0",
    "weaviate-client>=4.23.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agentic-memory = "agentic_memory:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
