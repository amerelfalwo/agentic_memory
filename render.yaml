services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Cognitive Memory AI Engine
  # -------------------------------------------------------------
  - type: web
    name: mnemos-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.presentation.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: model
        value: groq:qwen/qwen3.8-27b
      - key: WEAVIATE_HOST
        value: localhost
      - key: WEAVIATE_PORT
        value: "8085"
      - key: CORS_ORIGINS
        value: '["*"]'

